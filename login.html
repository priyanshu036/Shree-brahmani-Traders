<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure sign in for Shree Brahmani Traders — Construction Material Management" />
  <title>Sign In — Shree Brahmani Traders</title>
  <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      /* Brand — sampled from assets/img/logo.svg */
      --navy-900: #071f3d;
      --navy-800: #0c2f52;
      --navy-700: #123f69;
      --navy-600: #1a5285;
      --navy-500: #2568a3;
      --orange-600: #e85b16;
      --orange-500: #f7941d;
      --orange-400: #f9a94a;
      --orange-100: #fdeed9;

      --white: #ffffff;
      --bg: #f7f9fc;
      --bg-soft: #f8fafc;
      --border: #e4e9f0;
      --border-strong: #d3dbe6;
      --text: #16283c;
      --text-soft: #4d6076;
      --muted: #8496a9;

      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --success: #16a34a;
      --success-bg: #ecfdf3;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(820px 480px at 50% -12%, rgba(37, 104, 163, 0.09), transparent 66%),
        radial-gradient(680px 420px at 88% 108%, rgba(247, 148, 29, 0.09), transparent 62%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================
       CARD
       ========================================================== */
    .login-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      padding: 2.5rem 2.35rem 2rem;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow:
        0 1px 2px rgba(7, 31, 61, 0.04),
        0 20px 48px -22px rgba(7, 31, 61, 0.22);
      animation: cardIn 0.55s var(--ease) both;
    }

    /* Orange accent strip along the top edge */
    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 2.35rem;
      right: 2.35rem;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: linear-gradient(90deg, var(--orange-500), var(--orange-400) 55%, transparent);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Logo ---------- */
    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 1.6rem;
    }

    .brand img {
      width: auto;
      height: 62px;
      display: block;
      object-fit: contain;
    }

    /* ---------- Heading ---------- */
    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-align: center;
      color: var(--text);
    }

    .login-card__sub {
      margin-top: 0.4rem;
      margin-bottom: 1.75rem;
      font-size: 0.87rem;
      text-align: center;
      color: var(--text-soft);
    }

    /* ---------- Fields ---------- */
    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border-radius: 11px;
      background: var(--white);
      border: 1px solid var(--border-strong);
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .input-wrap:hover {
      border-color: #b9c6d6;
    }

    .input-wrap:focus-within {
      border-color: var(--navy-500);
      box-shadow: 0 0 0 4px rgba(37, 104, 163, 0.12);
    }

    .input-wrap.invalid {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1);
    }

    .input-wrap .icon {
      width: 18px;
      height: 18px;
      margin-left: 0.9rem;
      flex: 0 0 auto;
      color: var(--muted);
      transition: color 0.18s ease;
    }

    .input-wrap:focus-within .icon {
      color: var(--navy-600);
    }

    .input-wrap input {
      width: 100%;
      padding: 0.85rem 0.85rem;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: none;
    }

    .input-wrap input::placeholder {
      color: #a8b6c7;
    }

    .input-wrap input:-webkit-autofill,
    .input-wrap input:-webkit-autofill:hover,
    .input-wrap input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px var(--white) inset;
      caret-color: var(--text);
      transition: background-color 9999s ease-out;
    }

    .toggle {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      margin-right: 0.28rem;
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.16s ease, background 0.16s ease;
    }

    .toggle:hover {
      color: var(--navy-700);
      background: var(--bg-soft);
    }

    .toggle:focus-visible {
      outline: 2px solid var(--navy-500);
      outline-offset: 2px;
    }

    .toggle svg {
      width: 18px;
      height: 18px;
    }

    /* ---------- Row ---------- */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0.3rem 0 1.15rem;
      font-size: 0.82rem;
    }

    .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-soft);
      cursor: pointer;
      user-select: none;
    }

    .checkbox input {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border-radius: 5px;
      border: 1.5px solid var(--border-strong);
      background: var(--white);
      cursor: pointer;
      position: relative;
      transition: all 0.16s ease;
    }

    .checkbox input:hover {
      border-color: var(--navy-500);
    }

    .checkbox input:checked {
      background: var(--navy-600);
      border-color: var(--navy-600);
    }

    .checkbox input:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 1.5px;
      width: 4px;
      height: 8px;
      border: solid var(--white);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .checkbox input:focus-visible {
      outline: 2px solid var(--navy-500);
      outline-offset: 2px;
    }

    .link {
      color: var(--navy-600);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.16s ease;
    }

    .link:hover {
      color: var(--orange-600);
      text-decoration: underline;
    }

    /* ---------- Message ---------- */
    .message {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      font-size: 0.83rem;
      font-weight: 500;
      line-height: 1.35;
    }

    .message.show {
      display: flex;
      animation: msgIn 0.28s var(--ease) both;
    }

    .message.error {
      color: #991b1b;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
    }

    .message.success {
      color: #14532d;
      background: var(--success-bg);
      border: 1px solid #bbf7d0;
    }

    .message svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .shake {
      animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-7px); }
      40%, 60% { transform: translateX(7px); }
    }

    /* ---------- Button ---------- */
    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      width: 100%;
      padding: 0.9rem 1rem;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--white);
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      background: linear-gradient(140deg, var(--navy-600), var(--navy-800));
      box-shadow: 0 10px 22px -12px rgba(7, 31, 61, 0.85);
      transition: transform 0.16s var(--ease), box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 14px 26px -12px rgba(7, 31, 61, 0.9);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0) scale(0.995);
    }

    .btn:focus-visible {
      outline: 2px solid var(--navy-600);
      outline-offset: 3px;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.9;
    }

    .btn.success {
      background: linear-gradient(140deg, #15803d, #14532d);
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      border-top-color: var(--white);
      animation: spin 0.7s linear infinite;
    }

    .btn.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- Footer ---------- */
    .login-card__foot {
      margin-top: 1.6rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.74rem;
      color: var(--muted);
    }

    /* ---------- Language switch ---------- */
    .lang-switch {
      position: absolute;
      top: 1.1rem;
      right: 1.1rem;
      display: inline-flex;
      padding: 2px;
      gap: 2px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
    }

    .lang-switch button {
      min-width: 34px;
      padding: 0.24rem 0.5rem;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-soft);
      background: transparent;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .lang-switch button:hover {
      color: var(--navy-700);
    }

    .lang-switch button.is-active {
      color: var(--white);
      background: var(--navy-600);
    }

    .lang-switch button:focus-visible {
      outline: 2px solid var(--navy-500);
      outline-offset: 2px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 460px) {
      body {
        padding: 1.25rem 1rem;
      }

      .login-card {
        padding: 2rem 1.5rem 1.6rem;
        border-radius: 16px;
      }

      .login-card::before {
        left: 1.5rem;
        right: 1.5rem;
      }

      .brand img {
        height: 52px;
      }

      .login-card h1 {
        font-size: 1.32rem;
      }

      .row {
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="gu">ગુ</button>
    </div>

    <div class="brand">
      <img src="assets/img/logo.svg" alt="Shree Brahmani Traders"
           onerror="this.style.display='none';this.parentNode.textContent='SHREE BRAHMANI TRADERS';this.parentNode.style.color='#123f69';this.parentNode.style.fontWeight='800';this.parentNode.style.fontSize='1rem';this.parentNode.style.letterSpacing='0.04em';" />
    </div>

    <h1 data-i18n="auth.welcome">Welcome back</h1>
    <p class="login-card__sub" data-i18n="auth.subtitle">Sign in to continue to your dashboard.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username" data-i18n="auth.username">Username</label>
        <div class="input-wrap" id="usernameWrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Enter your username"
            data-i18n-placeholder="auth.usernamePlaceholder"
            autocomplete="username"
            spellcheck="false"
            autocapitalize="none"
            required
          />
        </div>
      </div>

      <div class="field">
        <label for="password" data-i18n="auth.password">Password</label>
        <div class="input-wrap" id="passwordWrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            data-i18n-placeholder="auth.passwordPlaceholder"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle" id="togglePassword" aria-label="Show password"
                  data-i18n-aria="auth.showPassword" aria-pressed="false">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="remember" />
          <span data-i18n="auth.remember">Remember me</span>
        </label>
        <a href="#" class="link" id="forgotLink" data-i18n="auth.forgot">Forgot password?</a>
      </div>

      <p class="message" id="message" role="alert" aria-live="polite"></p>

      <button type="submit" class="btn" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text" data-i18n="auth.signIn">Sign In</span>
      </button>
    </form>

    <p class="login-card__foot" data-i18n="auth.footer">&copy; 2026 Shree Brahmani Traders. All rights reserved.</p>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script>
    (function () {
      "use strict";

      const I18N = (window.SBT && window.SBT.i18n) || null;

      function t(key) {
        return I18N ? I18N.t(key) : key;
      }

      /* ===== Fixed credentials (kept in sync with SBT.config.auth) ===== */
      const CFG_AUTH = (window.SBT && window.SBT.config && window.SBT.config.auth) || {};
      const VALID_USERNAME = CFG_AUTH.username || "admin";
      const VALID_PASSWORD = CFG_AUTH.password || "admin";
      const SESSION_KEY = CFG_AUTH.sessionKey || "sbt_v1_session";

      const form = document.getElementById("loginForm");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const usernameWrap = document.getElementById("usernameWrap");
      const passwordWrap = document.getElementById("passwordWrap");
      const toggleBtn = document.getElementById("togglePassword");
      const eyeIcon = document.getElementById("eyeIcon");
      const messageEl = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = submitBtn.querySelector(".btn-text");
      const rememberBox = document.getElementById("remember");
      const forgotLink = document.getElementById("forgotLink");
      const langSwitch = document.getElementById("langSwitch");

      const EYE_OPEN =
        '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      const EYE_OFF =
        '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>' +
        '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>' +
        '<path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

      const ICON_ERROR =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>' +
        '<line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

      const ICON_SUCCESS =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';

      /* ===== Helpers ===== */
      function showMessage(type, text) {
        messageEl.className = "message show " + type;
        messageEl.innerHTML = (type === "error" ? ICON_ERROR : ICON_SUCCESS) +
          "<span></span>";
        messageEl.lastChild.textContent = text;
      }

      function clearMessage() {
        messageEl.className = "message";
        messageEl.innerHTML = "";
      }

      function markInvalid(wrap, input) {
        wrap.classList.add("invalid");
        input.setAttribute("aria-invalid", "true");
      }

      function clearInvalid(wrap, input) {
        wrap.classList.remove("invalid");
        input.removeAttribute("aria-invalid");
      }

      function shake(el) {
        el.classList.remove("shake");
        void el.offsetWidth;
        el.classList.add("shake");
      }

      function setLoading(isLoading) {
        submitBtn.classList.toggle("loading", isLoading);
        submitBtn.disabled = isLoading;
        btnText.textContent = isLoading ? t("auth.signingIn") : t("auth.signIn");
      }

      /* ===== Language switch ===== */
      function paintLangSwitch() {
        if (!langSwitch) return;
        const active = I18N ? I18N.lang() : "en";
        Array.prototype.slice.call(langSwitch.querySelectorAll("button")).forEach(function (btn) {
          const on = btn.getAttribute("data-lang") === active;
          btn.classList.toggle("is-active", on);
          btn.setAttribute("aria-pressed", String(on));
        });
      }

      function applyLanguage() {
        if (I18N) I18N.apply(document);
        document.title = t("auth.title");
        const desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute("content", t("auth.description"));
        document.documentElement.lang = I18N ? I18N.lang() : "en";
        paintLangSwitch();
        /* Keep the button label in sync with the current state. */
        if (!submitBtn.classList.contains("loading")) {
          btnText.textContent = submitBtn.classList.contains("success")
            ? t("auth.signedIn")
            : t("auth.signIn");
        }
      }

      if (langSwitch) {
        langSwitch.addEventListener("click", function (event) {
          const btn = event.target.closest("button[data-lang]");
          if (!btn || !I18N) return;
          I18N.setLang(btn.getAttribute("data-lang"));
          applyLanguage();
        });
      }

      applyLanguage();

      /* ===== Password visibility toggle ===== */
      toggleBtn.addEventListener("click", function () {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        eyeIcon.innerHTML = isHidden ? EYE_OFF : EYE_OPEN;
        toggleBtn.setAttribute("aria-label", t(isHidden ? "auth.hidePassword" : "auth.showPassword"));
        toggleBtn.setAttribute("aria-pressed", String(isHidden));
        passwordInput.focus();
      });

      /* ===== Clear errors while typing ===== */
      usernameInput.addEventListener("input", function () {
        clearInvalid(usernameWrap, usernameInput);
        clearMessage();
      });

      passwordInput.addEventListener("input", function () {
        clearInvalid(passwordWrap, passwordInput);
        clearMessage();
      });

      /* ===== Restore remembered username ===== */
      try {
        const saved = localStorage.getItem("sbt_username");
        if (saved) {
          usernameInput.value = saved;
          rememberBox.checked = true;
        }
      } catch (e) {
        /* localStorage may be unavailable */
      }

      /* ===== Forgot password ===== */
      forgotLink.addEventListener("click", function (event) {
        event.preventDefault();
        showMessage("error", t("auth.forgotMsg"));
      });

      /* ===== Submit ===== */
      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        clearMessage();
        clearInvalid(usernameWrap, usernameInput);
        clearInvalid(passwordWrap, passwordInput);

        if (!username && !password) {
          markInvalid(usernameWrap, usernameInput);
          markInvalid(passwordWrap, passwordInput);
          showMessage("error", t("auth.errBoth"));
          shake(form);
          usernameInput.focus();
          return;
        }

        if (!username) {
          markInvalid(usernameWrap, usernameInput);
          showMessage("error", t("auth.errUsername"));
          shake(usernameWrap);
          usernameInput.focus();
          return;
        }

        if (!password) {
          markInvalid(passwordWrap, passwordInput);
          showMessage("error", t("auth.errPassword"));
          shake(passwordWrap);
          passwordInput.focus();
          return;
        }

        if (username !== VALID_USERNAME || password !== VALID_PASSWORD) {
          markInvalid(usernameWrap, usernameInput);
          markInvalid(passwordWrap, passwordInput);
          showMessage("error", t("auth.errInvalid"));
          shake(form);
          passwordInput.select();
          return;
        }

        /* ===== Success ===== */
        setLoading(true);

        try {
          if (rememberBox.checked) {
            localStorage.setItem("sbt_username", username);
          } else {
            localStorage.removeItem("sbt_username");
          }

          /* Session shape must match SBT.app.login() in assets/js/app.js */
          localStorage.setItem(SESSION_KEY, JSON.stringify({
            user: username,
            name: t("shell.administrator"),
            loginAt: Date.now(),
            expires: Date.now() + (rememberBox.checked
              ? 30 * 24 * 3600 * 1000
              : 12 * 3600 * 1000)
          }));
        } catch (e) {
          /* ignore storage errors */
        }

        setTimeout(function () {
          setLoading(false);
          submitBtn.classList.add("success");
          btnText.textContent = t("auth.signedIn");
          showMessage("success", t("auth.success"));

          setTimeout(function () {
            window.location.href = "dashboard.html";
          }, 800);
        }, 850);
      });
    })();
  </script>
</body>
</html>
